<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vereinskalender – BBC Stendal Lizards</title>
<link rel="stylesheet" href="../shared/brand.css">
<link rel="stylesheet" href="kalender.css">
</head>
<body>
<main class="cal" id="cal" aria-label="Vereinskalender">
  <header class="cal-head">
    <div class="cal-title">
      <span class="kicker">BBC Stendal Lizards</span>
      <h1>Vereinskalender</h1>
    </div>
    <div class="cal-actions">
      <a class="btn ghost small" id="subscribe" href="#" title="Kalender abonnieren (Google, Apple, Outlook)">Abonnieren</a>
    </div>
  </header>

  <section class="toolbar" aria-label="Steuerung und Filter">
    <div class="nav">
      <button class="icon-btn" id="prev" aria-label="Voriger Monat">‹</button>
      <h2 id="monthLabel" aria-live="polite"></h2>
      <button class="icon-btn" id="next" aria-label="Nächster Monat">›</button>
      <button class="btn ghost small" id="today">Heute</button>
    </div>
    <div class="view" role="tablist" aria-label="Ansicht">
      <button role="tab" id="vMonth" aria-selected="true">Monat</button>
      <button role="tab" id="vList" aria-selected="false">Liste</button>
    </div>
  </section>

  <section class="filters" aria-label="Filter">
    <div class="chips" id="chips"></div>
    <label class="team"><span class="sr-only">Mannschaft</span>
      <select id="team"></select>
    </label>
  </section>

  <div id="status" class="status" role="status"></div>
  <div id="view"></div>
  <section id="dayPanel" class="day-panel" hidden aria-live="polite"></section>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <button class="close" id="mClose" aria-label="Schließen">×</button>
    <div class="m-stripe" id="mStripe"></div>
    <div class="m-body">
      <span class="badge" id="mBadge"></span>
      <h2 id="mTitle"></h2>
      <dl class="facts" id="mFacts"></dl>
      <p class="desc" id="mDesc"></p>
      <div class="m-actions" id="mActions"></div>
    </div>
  </div>
</div>
<script src="kalender.js"></script>
</body>
</html>
